<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doubao TTS Lab</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f2;
      color: #1d1d1f;
    }
    body {
      margin: 0;
      padding: 28px;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }
    .panel {
      background: #fff;
      border: 1px solid #d8d8d2;
      border-radius: 8px;
      padding: 18px;
      display: grid;
      gap: 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,.06);
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      font-weight: 650;
      color: #3d3d3f;
    }
    textarea, input, select {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #c8c8c2;
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      background: #fbfbfa;
      color: #1d1d1f;
    }
    textarea {
      min-height: 112px;
      resize: vertical;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .slider-row {
      display: grid;
      grid-template-columns: 1fr 64px;
      gap: 10px;
      align-items: center;
    }
    button {
      height: 42px;
      border: 0;
      border-radius: 6px;
      background: #1d1d1f;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    audio {
      width: 100%;
    }
    .muted {
      color: #6e6e73;
      font-size: 13px;
      line-height: 1.5;
    }
    .url {
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #555;
    }
    @media (max-width: 640px) {
      body { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Doubao TTS Lab</h1>
      <p class="muted">用于试听豆包实时流式 TTS。参数会直接拼到本地 <code>/doubao-tts/stream</code>。</p>
    </header>

    <section class="panel">
      <label>
        试听文本
        <textarea id="text">夜已经深了，我们先把车窗外的光放低一点。下一首歌别急着听歌词，先让鼓点和呼吸慢慢贴近。</textarea>
      </label>

      <div class="grid">
        <label>
          音色 Speaker
          <select id="speaker">
            <option value="zh_female_vv_uranus_bigtts">vv 女声</option>
            <option value="zh_male_taocheng_uranus_bigtts">taocheng 男声</option>
            <option value="zh_female_vv_uranus_bigtts">自定义：当前 vv</option>
          </select>
        </label>
        <label>
          情绪 Emotion
          <input id="emotion" placeholder="可留空；部分音色才支持" />
        </label>
      </div>

      <div class="grid">
        <label>
          语速 speech_rate
          <div class="slider-row">
            <input id="speechRate" type="range" min="-50" max="100" value="-5" />
            <input id="speechRateValue" type="number" min="-50" max="100" value="-5" />
          </div>
        </label>
        <label>
          音量 loudness_rate
          <div class="slider-row">
            <input id="loudnessRate" type="range" min="-50" max="100" value="8" />
            <input id="loudnessRateValue" type="number" min="-50" max="100" value="8" />
          </div>
        </label>
      </div>

      <button id="play">生成并播放</button>
      <audio id="audio" controls preload="none"></audio>
      <div id="status" class="muted">等待试听。</div>
      <div id="url" class="url"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function bindSlider(rangeId, valueId) {
      const range = $(rangeId);
      const value = $(valueId);
      range.addEventListener("input", () => { value.value = range.value; });
      value.addEventListener("input", () => { range.value = value.value; });
    }

    bindSlider("speechRate", "speechRateValue");
    bindSlider("loudnessRate", "loudnessRateValue");

    $("play").addEventListener("click", async () => {
      const params = new URLSearchParams({
        text: $("text").value.trim(),
        speaker: $("speaker").value,
        speech_rate: $("speechRateValue").value,
        loudness_rate: $("loudnessRateValue").value,
      });
      const emotion = $("emotion").value.trim();
      if (emotion) params.set("emotion", emotion);
      const url = `/doubao-tts/stream?${params.toString()}&ts=${Date.now()}`;
      $("url").textContent = url;
      $("status").textContent = "正在请求豆包流式音频...";
      $("audio").src = url;
      try {
        await $("audio").play();
        $("status").textContent = "播放中。";
      } catch (error) {
        $("status").textContent = `浏览器阻止自动播放，请手动点播放器。${error.message || error}`;
      }
    });
  </script>
</body>
</html>
