<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniMax WebSocket TTS Speed Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101113;
      --panel: #181a1f;
      --line: #343842;
      --ink: #f5f5f7;
      --muted: #a7adba;
      --accent: #f4f4f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(840px, calc(100vw - 32px));
      margin: 36px auto;
      display: grid;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 18px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    textarea, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #101216;
      color: var(--ink);
      padding: 12px;
      font-size: 15px;
      line-height: 1.5;
    }
    textarea { min-height: 140px; resize: vertical; }
    button {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #111;
      padding: 11px 18px;
      font-weight: 800;
      cursor: pointer;
      width: fit-content;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    audio { width: 100%; }
    pre {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0b0c0f;
      color: #cfd3dc;
      padding: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 13px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>MiniMax WebSocket TTS Speed Test</h1>
      <p>直接走 MiniMax WebSocket 流式 TTS，用来测试首声速度。不会影响主 demo。</p>
    </header>
    <section class="panel">
      <label>
        文案
        <textarea id="text">这里是 Melodio。夜已经慢下来了，第一首歌先不用解释太多，让它像车窗外的灯一样自己铺开。</textarea>
      </label>
      <label>
        音色
        <input id="voice" value="Chinese (Mandarin)_Warm_Bestie" />
      </label>
      <div class="row">
        <button id="test" type="button">测试流式播放</button>
        <button id="statusBtn" type="button">检查配置</button>
      </div>
      <audio id="audio" controls preload="none"></audio>
      <pre id="log">准备就绪。</pre>
    </section>
  </main>
  <script>
    const textEl = document.querySelector("#text");
    const voiceEl = document.querySelector("#voice");
    const audio = document.querySelector("#audio");
    const logEl = document.querySelector("#log");
    const testBtn = document.querySelector("#test");
    const statusBtn = document.querySelector("#statusBtn");

    let startedAt = 0;
    function elapsed() {
      return `${((performance.now() - startedAt) / 1000).toFixed(2)}s`;
    }
    function log(line) {
      logEl.textContent += `\n${line}`;
    }
    function resetLog(line) {
      logEl.textContent = line;
    }

    statusBtn.addEventListener("click", async () => {
      startedAt = performance.now();
      resetLog("检查配置中...");
      try {
        const res = await fetch("/minimax-tts-ws/status");
        const data = await res.json();
        resetLog(JSON.stringify(data, null, 2));
      } catch (error) {
        resetLog(`配置检查失败：${error.message}`);
      }
    });

    testBtn.addEventListener("click", async () => {
      const text = textEl.value.trim();
      const voice = voiceEl.value.trim();
      if (!text) {
        resetLog("请输入文案。");
        return;
      }
      testBtn.disabled = true;
      startedAt = performance.now();
      resetLog(`开始请求：0.00s`);
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      const url = `/minimax-tts-ws/stream?text=${encodeURIComponent(text)}&voice_id=${encodeURIComponent(voice)}&ts=${Date.now()}`;
      audio.onloadedmetadata = () => log(`loadedmetadata：${elapsed()}`);
      audio.oncanplay = () => log(`canplay：${elapsed()}`);
      audio.onplaying = () => log(`playing / 首声：${elapsed()}`);
      audio.onended = () => {
        log(`ended：${elapsed()}`);
        testBtn.disabled = false;
      };
      audio.onerror = () => {
        const code = audio.error ? audio.error.code : "unknown";
        log(`播放失败：${elapsed()} code=${code}`);
        testBtn.disabled = false;
      };
      audio.src = url;
      audio.load();
      try {
        await audio.play();
      } catch (error) {
        log(`浏览器拦截或流失败：${elapsed()} ${error.message}`);
        testBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
